name: Release

on:
  push:
    branches:
      - upm
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create package release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Wait for package tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          required_workflows=(
            "UPM Test (Unity Docker)"
            "UPM Test (Unity Beta)"
          )

          all_completed=false
          for attempt in $(seq 1 240); do
            runs="$(
              gh run list \
                --commit "$GITHUB_SHA" \
                --limit 20 \
                --json workflowName,status,conclusion
            )"

            all_completed=true
            for workflow in "${required_workflows[@]}"; do
              status="$(
                jq -r \
                  --arg workflow "$workflow" \
                  '[.[] | select(.workflowName == $workflow)][0].status // "missing"' \
                  <<<"$runs"
              )"
              conclusion="$(
                jq -r \
                  --arg workflow "$workflow" \
                  '[.[] | select(.workflowName == $workflow)][0].conclusion // ""' \
                  <<<"$runs"
              )"

              echo "$workflow: status=$status conclusion=$conclusion"
              if [[ "$status" != "completed" ]]; then
                all_completed=false
              elif [[ "$conclusion" != "success" ]]; then
                echo "::error::$workflow did not succeed: $conclusion"
                exit 1
              fi
            done

            if [[ "$all_completed" == "true" ]]; then
              break
            fi

            sleep 15
          done

          if [[ "$all_completed" != "true" ]]; then
            echo "::error::Timed out waiting for required Unity test workflows."
            exit 1
          fi

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(jq -r '.version' package.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid package version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^#### " version "[[:space:]]+" { found = 1; next }
            found && /^#### / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::No release notes found for $VERSION"
            exit 1
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            exit 0
          fi

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Release $VERSION" \
            --notes-file release-notes.md
